name: Integration Tests

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tests/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run smoke tests
      run: |
        cd tests
        pytest -m smoke --maxfail=5

    - name: Run unit tests
      run: |
        cd tests
        pytest -m unit --maxfail=10

    - name: Run integration tests
      run: |
        cd tests
        pytest -m integration --maxfail=10

    - name: Generate coverage report
      run: |
        cd tests
        pytest --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: tests/coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          tests/report.html
          tests/htmlcov/

  test-specific-peripherals:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        peripheral: [i2c, spi, adc, pwm, canfd, gpio, flash, system]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run ${{ matrix.peripheral }} tests
      run: |
        cd tests
        pytest -m ${{ matrix.peripheral }} -v
