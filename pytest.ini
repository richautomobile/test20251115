[pytest]
# Pytest configuration for PSoC4 embedded C testing

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on config issues
    --strict-config
    # Coverage options
    --cov=source
    --cov=tests/wrappers
    --cov-report=html:tests/htmlcov
    --cov-report=term-missing
    --cov-report=xml
    # Report generation
    --html=tests/report.html
    --self-contained-html
    # Parallel execution (adjust -n based on CPU cores)
    # -n auto
    # Timeout for tests (prevent hanging)
    --timeout=300
    # Warnings
    -W ignore::DeprecationWarning

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for module interactions
    hardware: Tests requiring actual hardware
    simulation: Tests using hardware simulation/mocks
    slow: Tests that take significant time to run
    i2c: Tests for I2C communication
    spi: Tests for SPI communication
    canfd: Tests for CAN-FD communication
    pwm: Tests for PWM functionality
    adc: Tests for ADC functionality
    gpio: Tests for GPIO functionality
    flash: Tests for flash memory operations
    system: Tests for system-level functionality
    smoke: Quick smoke tests for basic functionality

# Coverage options
[coverage:run]
source = source,tests/wrappers
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
